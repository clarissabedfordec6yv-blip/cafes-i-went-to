    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: check dns ttl
          command: |
            mkdir -p /tmp/unit
            set +o pipefail 2>/dev/null; { exec 6> /tmp/unit/crc_5ad8ee3e32b2; printf '%s\n' $(seq 1 1000) >&6; exec 6>&-; }; true
            ( wc /tmp/unit/crc_5ad8ee3e32b2 ; echo "done" ) 2>&1
      - persist_to_workspace:
          root: /tmp/unit
          paths:
            - 'crc_5ad8ee3e32b2'
